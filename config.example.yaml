# Do not register an unmeasured model. An unknown state refuses every new load.
listen: ":8095"
logLevel: info
healthCheckTimeout: 120
unloadTimeout: 30
queueTimeout: 180
prepareTimeout: 60
statusTimeout: 5
drainTimeout: 180
shutdownTimeout: 60
maxQueueSize: 256
preload: []

gpu:
  # This host: nvidia-smi -L → NVIDIA GeForce RTX 3090.
  device: "GPU-c47f1d0d-ea5d-4e6c-da7c-c9ad18b1b978"
  safetyMarginBytes: 1073741824
  maxObservationAge: 5

models:
  qwen-asr:
    baseURL: "http://127.0.0.1:8080"
    name: "Qwen ASR"
    aliases: [qwen3-asr]
    prepare:
      argv: ["/home/kjh/workspace/qwen-asr-vllm-docker-config/prepare-inferswap"]
    resourceProfile:
      profileId: rtx3090-asr-2026-09-26
      # Host nvidia-smi total used. The cap is the higher of two 3-round runs, plus 1 GiB.
      # 1s silence: load 20011 MiB, inference 20015 MiB.
      # 30min 16 kHz mono PCM16 silence, 120s chunks, two internal requests: load 19583 MiB, inference 19682 MiB.
      # The 30min peak was lower, so these bytes were not reduced.
      # Unload returned to the host baseline and did not grow, so residual 0 is measured.
      loadPeakBytes: 22060990464
      inferencePeakBytes: 22060990464
      unloadedResidualBytes: 0
      maxConcurrency: 1
      limits:
        input: "30min 16kHz mono PCM16 silence, 120s chunks, internal concurrency 2; cap kept from the higher 1s silence peak"
        rounds: 3
        measuredOn: "GPU-c47f1d0d-ea5d-4e6c-da7c-c9ad18b1b978"
    inferencePaths:
      - /v1/audio/transcriptions
    maxBodyBytes: 67108864
  qwen-fa:
    baseURL: "http://127.0.0.1:8090"
    name: "Qwen FA"
    prepare:
      argv: ["/home/kjh/workspace/qwen-fa-docker-config/prepare-inferswap"]
    resourceProfile:
      profileId: rtx3090-fa-2026-09-26
      # Host nvidia-smi total used. Three load/align/unload rounds of one 30min WAV.
      # Ten 180s Korean chunks, runtime batch 4. ASR was unloaded before these samples.
      # Loading-state max 2793 MiB. Inference max 5322 MiB. Plus 1 GiB on the higher observation.
      # The earlier one-chunk peak was 3256 MiB, so this cap is raised.
      # Unload returned to the host baseline and did not grow, so residual 0 is measured.
      loadPeakBytes: 6654263296
      inferencePeakBytes: 6654263296
      unloadedResidualBytes: 0
      maxConcurrency: 1
      limits:
        input: "30min 16kHz mono PCM16, ten 180s Korean chunks, batch 4"
        rounds: 3
        measuredOn: "GPU-c47f1d0d-ea5d-4e6c-da7c-c9ad18b1b978"
    inferencePaths:
      - /align
    maxBodyBytes: 67108864
